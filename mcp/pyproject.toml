[project]
name = "melos-mcp"
version = "0.1.0"
description = "MCP service for Melos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "google-genai>=0.7.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
