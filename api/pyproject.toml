[project]
name = "melos-api"
version = "0.1.0"
description = "Melos Recipe & Kitchen System API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.0.1",
    "pydantic==2.10.5",
    "pydantic-settings==2.5.2",
    "google-generativeai==0.7.2",
    "weasyprint==61.2",
    "aiosmtplib==3.0.1",
    "python-multipart==0.0.7",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "pillow==11.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "black==25.1.0",
    "mypy==1.15.0",
    "httpx==0.28.1",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
