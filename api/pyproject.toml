[project]
name = "melos-api"
version = "0.1.0"
description = "Melos Recipe & Kitchen System API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "sqlalchemy==2.0.23",
    "alembic==1.13.1",
    "psycopg[binary]==3.9.9",
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "google-generativeai==0.3.0",
    "weasyprint==60.1",
    "aiosmtplib==3.0.0",
    "python-multipart==0.0.6",
    "requests==2.31.0",
    "beautifulsoup4==4.12.2",
    "pillow==10.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "ruff==0.1.8",
    "black==23.12.1",
    "mypy==1.7.1",
    "httpx==0.25.2",
]

[tool.uv]
python-version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
