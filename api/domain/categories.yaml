# categories.yaml — controlled vocabulary for recipe tagging
# Cuisine source: https://cheatsheets.davidveksler.com/global_cuisine_guide.html
#   depth: full  → section has Key Ingredients / Practices / Regions
#   depth: brief → "Further Culinary Exploration" one-liner only (thin signals)
# Signal tiers (defining/characteristic/common) are editorial judgment, not from the source.

schema_version: 1

matching:
  normalize: [lowercase, strip_accents, collapse_whitespace]
  # alias matches a text token exactly, or alias+"s" / alias+"es" (plurals). No prefix match:
  # "ajo" must not hit "ajonjoli", "lima" must not hit "limon".
  token_match: whole_word_with_plurals
  longest_alias_first: true        # "queso feta" → feta, not cheese; "pimenton ahumado" → paprika
  fields:
    ingredients: [ingredients.name]  # main ingredient and aliases match names only; cuisine also reads steps (below)
    dishes: [title]
  stopwords:                       # ignored when counting title words for coverage; they add no context
    en: [a, an, and, as, at, by, for, from, in, into, is, it, its, of, on, or, over, the, this, that, to, with]
    es: [a, al, con, de, del, e, el, en, la, las, lo, los, o, para, por, sin, u, un, una, unas, unos, y]
  phrase_exclusions:               # the phrase's words do not count for the listed ingredient ids; other words still count
    - {phrase: "for the sake of", blocks: [sake]}
    - {phrase: "cloves of garlic", blocks: [clove]}
    - {phrase: "clove of garlic", blocks: [clove]}
    - {phrase: "garlic clove", blocks: [clove]}
    - {phrase: "ice cream", blocks: [cream]}
    - {phrase: "coconut cream", blocks: [cream]}
    - {phrase: "peanut butter", blocks: [butter]}
    - {phrase: "almond butter", blocks: [butter]}
    - {phrase: "cocoa butter", blocks: [butter]}
    - {phrase: "wine vinegar", blocks: [wine]}
    - {phrase: "cider vinegar", blocks: [apple]}
    - {phrase: "egg noodle", blocks: [egg]}
    - {phrase: "rice noodle", blocks: [rice]}
    - {phrase: "rice paper", blocks: [rice]}
    - {phrase: "rice flour", blocks: [rice, wheat_flour]}
    - {phrase: "corn flour", blocks: [wheat_flour]}
    - {phrase: "almond flour", blocks: [wheat_flour]}
    - {phrase: "coconut flour", blocks: [wheat_flour]}
    - {phrase: "lemon grass", blocks: [lemon]}
    - {phrase: "mantequilla de mani", blocks: [butter]}
    - {phrase: "mantequilla de cacahuate", blocks: [butter]}
    - {phrase: "pasta de", blocks: [pasta]}
    - {phrase: "salsa de pescado", blocks: [fish]}
    - {phrase: "vinagre de vino", blocks: [wine]}
    - {phrase: "vinagre de sidra", blocks: [apple]}
    - {phrase: "harina de maiz", blocks: [wheat_flour]}
    - {phrase: "harina de arroz", blocks: [rice, wheat_flour]}
    - {phrase: "harina de almendra", blocks: [wheat_flour]}
    - {phrase: "harina de coco", blocks: [wheat_flour]}
    - {phrase: "col de bruselas", blocks: [vegetables]}
    - {phrase: "col rizada", blocks: [vegetables]}
  cuisine:
    # Every tag and variant is scored. A node matches when either rule holds. Matches are then ranked.
    title:
      min_coverage: 0.7              # share of content words in the title (stopwords excluded) covered by the node's dish names, labels and aliases
    steps:
      min_ingredients: 4             # distinct ingredient ids of the node (defining, characteristic, common) found in the steps; at least 4
      min_recipe_ingredients: 5      # recipes with fewer ingredient lines lack context: the steps rule is off and the title decides alone
    rank: total_matches              # matched title phrases + matched step ingredients (title phrases only when the steps rule is off); ties: see tiebreak
    # tiebreak: title coverage, then body coverage (distinct ingredient ids and techniques of the node found in the steps; 0 when the steps rule is off).
    # Still tied: every tied node is kept, up to max_results.
    tiebreak: [title_coverage, body_coverage]
    max_results: 2                   # one per tag: a variant and its tag never both count
    # fallback (international) and name rollup live in cuisine.yml#/resolution
  main_ingredient:
    min_results: 0
    max_results: 2
    max_results: 2
    rule: >-
      The ingredient that defines the dish (named in title, or largest share by weight).
      Aromatics, fats, sauces and spices are never the main ingredient.

# Alias → several canonical ids. Matcher credits every listed id.
# These strings must NOT appear in any ingredients[*] list.
ambiguous_aliases:
  limon: [lemon, lime]               # CR "limón" = lime; ES "limón" = lemon
  coriander: [cilantro, coriander_seed]
  pimenton: [paprika, bell_pepper]   # ES paprika; CO/VE bell pepper

