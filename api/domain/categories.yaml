categories:

  main_ingredient:
    cardinality: {min: 0, max: 2}
    values:
      poultry:    {label: {en: Poultry, es: Aves},             group: protein, match: [chicken, turkey, duck]}
      beef:       {label: {en: Beef, es: Res},                 group: protein, match: [beef]}
      pork:       {label: {en: Pork, es: Cerdo},               group: protein, match: [pork, cured_ham, kielbasa]}
      lamb:       {label: {en: Lamb, es: Cordero},             group: protein, match: [lamb]}
      fish:       {label: {en: Fish, es: Pescado},             group: protein, match: [fish, preserved_fish]}
      seafood:    {label: {en: Seafood, es: Mariscos},         group: protein, match: [seafood]}
      egg:        {label: {en: Egg, es: Huevo},                group: protein, match: [egg]}
      legumes:    {label: {en: Legumes, es: Legumbres},        group: protein, match: [lentils, chickpeas, beans, tofu]}
      pasta:      {label: {en: Pasta & noodles, es: Pasta y fideos}, group: starch, match: [pasta, noodles]}
      rice:       {label: {en: Rice, es: Arroz},               group: starch, match: [rice, jasmine_rice, short_grain_rice]}
      corn:       {label: {en: Corn, es: Maíz},                group: starch, match: [corn, polenta]}
      potato:     {label: {en: Potato, es: Papa},              group: starch, match: [potato]}
      vegetables: {label: {en: Vegetables, es: Vegetales},     group: produce, match: [vegetables, eggplant, beet, root_vegetables, mushroom, green_beans]}
      fruit:      {label: {en: Fruit, es: Fruta},              group: produce, match: [tropical_fruit, apple, berries, cranberry, avocado]}

  cuisine:
    cardinality: {min: 0, max: 2}
    values_from: cuisine.yml#/cuisines      # role: tag nodes are assignable; see cuisine.yml#/resolution
