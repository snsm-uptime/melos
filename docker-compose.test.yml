# Test overlay — run API pytest against Compose Postgres (AD-2: db|api|ui only).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm --build api
#
# Builds api with --group dev so pytest is installed; keeps default prod image --no-dev.
# Prefer `pytest` on PATH (venv) — do not `uv run` as appuser against a root-owned .venv.

services:
  db:
    # Base file waits 1h between checks; same short window as docker-compose.dev.yml.
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        UV_SYNC_ARGS: "--group dev"
    volumes:
      - ./api/tests:/app/tests
    # replaces CMD — do not invoke scripts.entrypoint / uvicorn
    command: ["pytest", "-q"]
    # Never the dev database (POSTGRES_DB). Integration tests write committed
    # rows that collide with dev seed data (e.g. owner@example.com).
    # Database name comes from TEST_POSTGRES_DB (default melos_test). It must exist:
    #   docker compose exec db createdb -U $POSTGRES_USER "${TEST_POSTGRES_DB:-melos_test}"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${TEST_POSTGRES_DB:-melos_test}
    healthcheck:
      disable: true

  ui:
    profiles:
      - donotstart
