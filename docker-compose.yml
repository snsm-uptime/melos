# Local / default Compose graph — melos
# Services: db | api | ui | jobs (AD-2, spec 073). Volumes outside the repo (AD-3 / NFR-9).
# Requires a local `.env` (copy from `.env.example`) — no silent secret defaults.

# MELOS_COMPOSE_NAME / API_HOST_PORT / UI_HOST_PORT let parallel worktrees
# run isolated Compose stacks without port or container-name clashes.
# Defaults preserve the single-checkout local workflow.
name: ${MELOS_COMPOSE_NAME:-melos}

# One logging setup for every service, so `docker compose logs` collects them together (spec 073 R7).
x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    logging: *json-logging
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - type: bind
        source: ${MELOS_DATA:-${HOME}/melos}/pgdata
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1h
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    logging: *json-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-melos_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-20}
      AUTH_RATE_LIMIT_REGISTER_MAX: ${AUTH_RATE_LIMIT_REGISTER_MAX:-5}
      AUTH_RATE_LIMIT_REGISTER_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_REGISTER_WINDOW_SECONDS:-3600}
      AUTH_RATE_LIMIT_SIGN_IN_MAX: ${AUTH_RATE_LIMIT_SIGN_IN_MAX:-20}
      AUTH_RATE_LIMIT_SIGN_IN_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_SIGN_IN_WINDOW_SECONDS:-900}
      AUTH_RATE_LIMIT_PASSWORD_RESET_REQUEST_MAX: ${AUTH_RATE_LIMIT_PASSWORD_RESET_REQUEST_MAX:-5}
      AUTH_RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW_SECONDS:-3600}
      AUTH_RATE_LIMIT_VERIFY_REQUEST_MAX: ${AUTH_RATE_LIMIT_VERIFY_REQUEST_MAX:-5}
      AUTH_RATE_LIMIT_VERIFY_REQUEST_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_VERIFY_REQUEST_WINDOW_SECONDS:-3600}
      AUTH_CLIENT_IP_HEADER: ${AUTH_CLIENT_IP_HEADER:-X-Melos-Client-IP}
      # Docker bridge + loopback only — not blanket RFC1918 (10/8, 192.168/16).
      # Pin tighter (ui container CIDR) if api is reachable beyond the Compose network.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12,127.0.0.1,::1}
      PDF_STORAGE_PATH: ${PDF_STORAGE_PATH:-/data/pdfs}
      # Recipe embeddings and search (spec 019); the worker is a thread inside this service.
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      GEMINI_EMBED_DIM: ${GEMINI_EMBED_DIM:-768}
      EMBED_TEXT_STRATEGY: ${EMBED_TEXT_STRATEGY:-toon}
      EMBEDDING_WORKER_ENABLED: ${EMBEDDING_WORKER_ENABLED:-true}
      EMBED_WORKER_POLL_S: ${EMBED_WORKER_POLL_S:-5}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-1}
      EMBED_RETRY_FIRST_WAIT_S: ${EMBED_RETRY_FIRST_WAIT_S:-60}
      EMBED_RETRY_GROWTH: ${EMBED_RETRY_GROWTH:-1.5}
      EMBED_RETRY_CAP_S: ${EMBED_RETRY_CAP_S:-7200}
      SEARCH_MIN_CLOSENESS: ${SEARCH_MIN_CLOSENESS:-0.65}
      SEARCH_RECORD_RETENTION_DAYS: ${SEARCH_RECORD_RETENTION_DAYS:-180}
      # Dev/worktree only — seeds pre-verified accounts at boot (see api/scripts/seed_dev_user.py).
      SEED_DEV_USER: ${SEED_DEV_USER:-0}
      SEED_DEV_USER_EMAIL: ${SEED_DEV_USER_EMAIL:-}
      SEED_DEV_USER_PASSWORD: ${SEED_DEV_USER_PASSWORD:-}
      SEED_DEV_USER_ALIAS: ${SEED_DEV_USER_ALIAS:-}
      SEED_DEV_USER_ADMIN: ${SEED_DEV_USER_ADMIN:-0}
      SEED_DEV_USER_KITCHEN: ${SEED_DEV_USER_KITCHEN:-}
      SEED_DEV_MEMBER_EMAIL: ${SEED_DEV_MEMBER_EMAIL:-}
      SEED_DEV_MEMBER_PASSWORD: ${SEED_DEV_MEMBER_PASSWORD:-}
      SEED_DEV_MEMBER_ALIAS: ${SEED_DEV_MEMBER_ALIAS:-}
      SEED_RECIPES_SOURCE_URL: ${SEED_RECIPES_SOURCE_URL:-}
      SEED_RECIPES_SOURCE_EMAIL: ${SEED_RECIPES_SOURCE_EMAIL:-}
      SEED_RECIPES_SOURCE_PASSWORD: ${SEED_RECIPES_SOURCE_PASSWORD:-}
      SEED_RECIPES_SOURCE_NOTEBOOKS: ${SEED_RECIPES_SOURCE_NOTEBOOKS:-}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${MELOS_DATA:-${HOME}/melos}/pdfs
        target: /data/pdfs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 1h
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - internal

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    logging: *json-logging
    env_file:
      - .env
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      AUTH_CLIENT_IP_HEADER: ${AUTH_CLIENT_IP_HEADER:-X-Melos-Client-IP}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "${UI_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 1h
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  # Scheduled ingredient translation (spec 073). No published port: it only reaches db and Gemini.
  # Built from the api image, with its own entry point and environment.
  jobs:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["python", "-m", "jobs"]
    logging: *json-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # No default: the job stops at startup with a message when this is empty (FR-015).
      GEMINI_TRANSLATE_MODEL: ${GEMINI_TRANSLATE_MODEL:-}
      JOBS_INTERVAL_SECONDS: ${JOBS_INTERVAL_SECONDS:-3600}
      JOBS_TRANSLATE_BATCH_SIZE: ${JOBS_TRANSLATE_BATCH_SIZE:-50}
      JOBS_RUN_ONCE: ${JOBS_RUN_ONCE:-0}
      JOBS_HEARTBEAT_PATH: ${JOBS_HEARTBEAT_PATH:-/tmp/jobs-heartbeat}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The job has no HTTP server: the heartbeat file must be less than 7200 s old (research R8).
      test: ["CMD-SHELL", "python -m jobs.heartbeat"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
