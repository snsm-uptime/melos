version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: melos-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ${MELOS_DATA:-${HOME}/melos}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - melos

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: melos-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src
      - ./api/scripts:/app/scripts
      - ./api/pyproject.toml:/app/pyproject.toml
      - ./api/alembic.ini:/app/alembic.ini
    networks:
      - melos
    command: uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  ui:
    build:
      context: .
      dockerfile: ui.Dockerfile.dev
    container_name: melos-ui
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    networks:
      - melos

  # mcp:
  #   build:
  #     context: .
  #     dockerfile: mcp.Dockerfile
  #   container_name: melos-mcp
  #   environment:
  #     ENVIRONMENT: development
  #     LOG_LEVEL: debug
  #   ports:
  #     - "9000:9000"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - ./mcp:/app
  #   networks:
  #     - melos
  #   command: uvicorn server.main:app --host 0.0.0.0 --port 9000 --reload

volumes:
  ui_node_modules:

networks:
  melos:
    driver: bridge
