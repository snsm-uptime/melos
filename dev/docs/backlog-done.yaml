  - id: S-069
    title: Recipe quick add button in the navigation, and adding a personal-notebook recipe to a kitchen
    epic: Recipes
    priority: must
    status: done
    journey: J3
    source: owner request 2026-11-04 (post-MVP; not in prd.md; extends J2 capture entry points and J3)
    notes: >
      Spec: specs/069-recipe-quick-add.
      A "quick add recipe" button in the navigation opens every existing add-recipe option (the
      capture modes) plus "Recipe from another notebook": pick a recipe from a personal notebook the
      person can read and put it into a kitchen. The same option is added to the kitchen's own add
      menu as "Recipe from another notebook", targeting the open kitchen. A recipe is in exactly one
      notebook, so "assign to the kitchen" is a copy into a kitchen notebook (the member's own by
      default), close to S-048's single-recipe copy. Open for its spec: whether it reuses or waits
      for S-048 name normalization, which kitchen the nav button targets outside a kitchen, and
      whether the copy keeps an origin label like a snapshot.
