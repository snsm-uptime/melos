  - id: S-058
    title: Personal notebook ownership passes to the longest-standing member when the owner's account is deleted
    epic: Recipes
    priority: must
    status: done
    journey: J1a
    source: prd.md 1.5H, J1a edge cases, Appendix A (User); redesign 2026-10-23
    verification: >
      Built on 058-notebook-ownership-passing (2026-11-01). api 1201 passed in the Compose overlay
      with RECIPE_TEXT_MAX_CHARS=5000 and on a throwaway Postgres; ui 1182 passed. The browser walk
      belongs to S-054, because nothing a person sees can trigger the rule until then.
    notes: >
      Re-scoped 2026-10-23 (final model): kept copies and the system-managed kitchen notebook were
      dropped, because kitchen notebooks belong to the kitchen and leaving a kitchen only ends
      access. What remains: when an owner's account is deleted, each personal notebook they own
      passes to its longest-standing member, or is deleted when it has none. Build order
      (checklist CHK001, 2026-10-23): must be built before, or together with, account deletion
      (S-054). No DELETE /auth/me route exists today, so S-056 cannot leave an ownerless personal
      notebook until then.

