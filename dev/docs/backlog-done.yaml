  - id: S-069
    title: Refused site registry (a site's license wall gets its own message and is counted for the admin)
    epic: Capture
    priority: must
    status: done
    verification: >
      Built 2026-11-05 on worktree-69. Migration 0016_recipe_copied_from: upgrade, downgrade and
      upgrade tested. api in Compose (test overlay): 1934 passed, 8 failed, all outside this story
      (live embedder, Spanish kitchen-notebook names, paste limits, vocabulary, a shopping-list
      date); ruff clean. ui: 1462 vitest tests, lint and typecheck clean. Archived kitchen answers
      403 kitchen_archived like the snapshot route (contract updated). Not done: the browser walk
      (T029, quickstart steps 3 to 8 at 360px and 1280px, both themes and languages).
    journey: J3
    source: owner request 2026-11-04 (post-MVP; not in prd.md); specs/067-refused-site-registry
    notes: >
      When a site answers a link capture (S-026) with 401, 402, 403 or 451, the member sees "This
      website requires a license, it's not supported yet." (422 site_requires_license) instead of
      the generic fetch message. Each refusal is counted per registrable domain (tldextract,
      bundled suffix list) in refused_site, with the last status and up to 1,000 characters of
      the site's own text; refused_site_member holds an HMAC fingerprint per member for the
      distinct count, never a user id (migration 0016). The admin dashboard (spec 055) shows them
      in a "Refused sites" tab, so the owner can see which sites are worth licensing.

