  - id: S-056
    title: Personal and kitchen notebooks (entity, default notebook, kitchen notebook at kitchen creation, capture notebook, read routes)
    epic: Recipes
    priority: must
    status: done
    source: prd.md 1.4, 1.5 H, 1.6 (notebook, notebook_membership, users.default_notebook_id), J1a; specs/056-notebooks
    acceptance: [AC1a.2]
    notes: >
      Prerequisite for S-016: build first. Redesigned 2026-10-23 (final): a personal notebook
      belongs to people (one owner, members by invite) and is never shown in a kitchen; a kitchen
      notebook belongs to a kitchen and every member reads and writes it while they belong to it.
      Creates the notebook (kitchen_id, source_notebook_id), notebook_membership and ingredient
      tables (a catalog is a set of unique normalized names); the person's default notebook
      ("{alias}'s Notebook") on first use (users.default_notebook_id, ON DELETE SET NULL,
      recreated silently); a kitchen notebook "{alias}'s ({kitchen name}) Notebook" created by
      the kitchen service with every new kitchen; the capture notebook step (one notebook: use it;
      several: the member picks; none: create one; archived kitchen: refused); read routes for a
      person's notebooks, one notebook and a kitchen's notebooks. Signup's "My kitchen" gets its
      notebook from the capture step (signup and the auth routes are not changed). Invites
      (S-057), snapshots (S-035) and ownership passing (S-058) come later. Spec 056 must be
      re-specified.
      Enhancement 2026-10-29: the capture notebook step now auto-selects each member's own kitchen
      notebook if they have one, creating one on first capture. Members can still explicitly pick
      different notebooks if needed (ResolveCaptureNotebookService._kitchen logic updated).
    verification: >
      Reworked to the snapshot model on s55-notebooks (2026-10-25). api: 432 passed and 2
      skipped in Compose (dev and test overlays). ui: 285 vitest tests, lint and typecheck
      clean. Migrations 0003_personal_kitchen_notebooks and 0004_drop_kitchen_hide: upgrade,
      downgrade to 0002 and upgrade again on a scratch database with invented users and
      kitchens, which were unchanged. Not done: the manual walk on the running stack
      (quickstart sections 3, 5 and 6). Not committed and not pushed.

