  # ---------------------------------------------------------------------------
  - id: S-046
    title: Edit shopping list items while the list is active
    epic: Cart
    priority: should
    status: backlog
    source: prd.md Appendix A (ShoppingListItem)
    notes: >
      Adding and removing hand items moved to S-025 (2026-10-30). This story keeps editing the other lines.
      The item PATCH route only sets `bought` (spec 070); quantity and name edits are not built (checked
      by S-077, 2026-11-18).

  - id: S-068
    title: Cart receipts (paste what was bought; match it to the shopping list and keep it with the list)
    epic: Cart
    priority: must
    status: backlog
    journey: J5
    source: owner request 2026-11-04 (post-MVP; not in prd.md; extends J5 Saved list)
    notes: >
      A member pastes a receipt (the text of what was bought) for the kitchen's active shopping list
      (S-025). The items are matched to the list's lines by ingredient name (S-018 matcher), the
      matched lines are marked bought, and the receipt is kept with the list, so a closed list shows
      what was actually bought. Open for its spec: whether a receipt photo is accepted and stored
      (allowed since the MVP rule on photos was lifted), whether prices are kept, how unmatched
      receipt items are shown, and whether S-031 (history in chat) reads receipts.

