  - id: S-048
    title: Copy a recipe into another notebook (normalize names, confirm)
    epic: Recipes
    priority: should
    status: backlog
    journey: J3
    source: prd.md 1.5G, J3 Copy to notebook (replaces "Use in a kitchen" and "Copy to my notebook", redesign 2026-10-23)
    acceptance: [AC3.3, AC3.4]
    notes: >
      Any recipe the person can read, into a notebook they can write to. Names are
      normalized against the target's catalog with the S-018 matcher; the target's names win and
      the person sees every change before confirming. The person is the copy's author. The copy
      has no link to the original; the two drift apart. Note (2026-11-05): the single-recipe copy with
      name matching is built under S-071 (ShareRecipeService), so S-048 needs only its confirmation
      step. S-035 built the shared step first:
      SqlAlchemyRecipeRepository.copy_all copies a whole notebook and keeps authors, so a single
      recipe copy reuses its parts and adds the name matching. Copied recipes need embeddings
      (S-019).

