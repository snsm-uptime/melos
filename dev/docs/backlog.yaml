  - id: S-047
    title: "Kitchen recipe cards: author and notebook filters, ingredient filter, cart-frequency sort"
    epic: Recipes
    priority: should
    status: backlog
    journey: J3
    source: user request in clarify session 016 (not in prd.md; extends J3 list)
    notes: >
      Cards show a recipe image preview or a default cooking-pot SVG, the title, and author chips
      (ui/components/Chip). Filters: ingredients, recipe author, notebook. Sort: times added to a
      cart in this kitchen, ascending or descending (recipe.cart_add_count). Cards cover every
      notebook of the kitchen. Author alias comes from the recipe's author_id; "unknown" when the
      author's account is deleted (redesign 2026-10-23).
      Cards with the recipe image or default pot and the author chip are built (S-067, S-021,
      ui/components/RecipeCard). Not built: sort by recipe.cart_add_count (counted, read only by the
      admin dashboard), and the author, notebook and ingredient filters; the list has a text filter
      only (checked by S-077, 2026-11-18).

  - id: S-048
    title: Confirm ingredient name changes when copying a recipe into another notebook
    epic: Recipes
    priority: should
    status: backlog
    journey: J3
    source: prd.md 1.5G, J3 Copy to notebook (replaces "Use in a kitchen" and "Copy to my notebook", redesign 2026-10-23)
    acceptance: [AC3.3, AC3.4]
    notes: >
      Any recipe the person can read, into a notebook they can write to. Names are
      normalized against the target's catalog with the S-018 matcher; the target's names win and
      the person sees every change before confirming. The person is the copy's author. The copy
      has no link to the original; the two drift apart.
      Copy from any readable notebook is built (S-069, spec 069) and copy to a co-member's default
      notebook with name matching (S-071). What is left: show each name change from the target
      catalog and let the person confirm before the copy is saved (AC3.3, AC3.4). Checked by S-077,
      2026-11-18.

