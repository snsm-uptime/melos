# Melos backlog
# Source: dev/docs/prd.md (journeys J0–J6, Appendix C priorities), specs/001-finance-dashboard-reuse/tasks.md (bootstrap),
#         git history (bootstrap merged in #4 and #5).
#
# Status values:
#   done         implemented and merged (manual verification may still be open; see verification)
#   in_progress  being implemented now
#   in_design    a speckit spec exists under specs/ for the story, no implementation yet
#   backlog      no speckit spec yet (PRD mention alone is not enough), or explicitly Later in the PRD
#
# Spec folders: specs/NNN-short-name, where NNN is the story number (S-016 -> specs/016-capture-recipe-text).
# specs/001-finance-dashboard-reuse is the bootstrap spec for S-001 to S-014 (AGENTS.md, Spec folders).
#
# Order within the Must work: the fewest stories that give a first full flow come first
# (capture -> save -> list -> cart -> shopping list, PRD J2 to J5). Capturing straight into a
# kitchen notebook covers that flow, so snapshots (S-035), sharing personal notebooks (S-057),
# ownership passing (S-058) and embeddings (S-019, needed only by Ask and semantic search)
# come after the shopping list, followed by extra input paths, editing and PDF (S-026, S-027,
# S-028). Reordered 2026-10-22 (notebooks).
# Notebook redesign 2026-10-23 (final): personal notebooks (one owner, members by invite) are
# private; kitchen notebooks belong to a kitchen and every member reads and writes them; a personal
# notebook reaches a kitchen only as a snapshot copy. Kitchen links and kept copies were dropped.
# S-056 re-scoped, S-057 added, S-035, S-048 and S-058 re-titled (PRD 1.5 H, 1.6, J1a).
# MVP closed 2026-11-04: the MVP is the work done up to that date. Open stories are post-MVP and
# are not held to MVP limits (constitution 2.0.0, principle 9; PRD Appendix C): the owner picks
# them by priority, and a should or later story no longer waits for the musts. S-067 and S-068
# added the same day.

# Reordered 2026-11-05: the shopping list is the focus (S-070 added). No story was removed;
# duplicate entries of S-067 (the stale backlog copy; the done copy kept) and S-068 were merged. Open stories are grouped by
# epic and journey below the focus; done stories are at the end.

