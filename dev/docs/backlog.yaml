  - id: S-020
    title: Save a confirmed draft into its notebook and create new catalog entries
    epic: Recipes
    priority: must
    status: in_progress
    journey: J2
    source: prd.md 1.5A, 1.6, J2 Save, Appendix A (Recipe); specs/020-save-confirmed-draft
    acceptance: [AC3.5]
    notes: >
      Saves once, into the notebook the capture started from, with the member as author; a
      capture in a kitchen saves into one of the kitchen's notebooks (redesign 2026-10-23,
      replaces "saves twice"). Recipe lines store the ingredient name as a
      normalized string; new names are added to the notebook's catalog. Also stores unique
      vague amounts, moved here from S-016 (spec 016, 2026-10-22). No embedding until S-019.
      Spec 056 (2026-10-25): the save calls ResolveCaptureNotebookService before it writes
      anything, and the step may have committed a notebook it created, so a failed save keeps
      that notebook. The save maps KitchenArchivedError, NotebookChoiceRequiredError,
      NotebookNotFoundError and KitchenNotFoundError to HTTP (spec 056 contract, research R13).
      Main ingredients and cuisines are out of the MVP (2026-10-27, S-061), so a saved recipe has none.
    verification: >
