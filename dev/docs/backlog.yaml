# Melos backlog
# Source: dev/docs/prd.md (journeys J0–J6, Appendix C priorities), specs/001-finance-dashboard-reuse/tasks.md (bootstrap),
#         git history (bootstrap merged in #4 and #5).
#
# Status values:
#   done         implemented and merged (manual verification may still be open; see verification)
#   in_progress  being implemented now
#   in_design    a speckit spec exists under specs/ for the story, no implementation yet
#   backlog      no speckit spec yet (PRD mention alone is not enough), or explicitly Later in the PRD
#
# Spec folders: specs/NNN-short-name, where NNN is the story number (S-016 -> specs/016-capture-recipe-text).
# specs/001-finance-dashboard-reuse is the bootstrap spec for S-001 to S-014 (AGENTS.md, Spec folders).
#
# Order within the Must work: the fewest stories that give a first full flow come first
# (capture -> save -> list -> cart -> shopping list, PRD J2 to J5). Capturing straight into a
# kitchen's notebook covers that flow, so copying between notebooks (S-034) and embeddings
# (S-018, needed only by Ask and semantic search) come after the shopping list, followed by
# extra input paths, editing and PDF (S-025, S-026, S-027). Reordered 2026-10-22 (notebooks).

