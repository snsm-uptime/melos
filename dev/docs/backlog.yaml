  - id: S-058
    title: Personal notebook ownership passes to the longest-standing member when the owner's account is deleted
    epic: Recipes
    priority: must
    status: backlog
    journey: J1a
    source: prd.md 1.5H, J1a edge cases, Appendix A (User); redesign 2026-10-23
