  - id: S-070
    title: Shopping by store (mark list items bought, store tabs on the list, ingredient catalog page in the side panel)
    epic: Cart
    priority: must
    status: in_progress
    journey: J5
    source: owner request 2026-11-05 (post-MVP; not in prd.md; extends J5 Saved list); specs/070-shopping-by-store
    verification: >
      Built 2026-11-05 on branch 070-shopping-by-store, not committed. Migration
      0018_shopping_places: upgrade, downgrade and upgrade tested. api in Compose (test overlay): 2015
      passed, 8 failed, the same 8 as S-069 (live embedder, Spanish kitchen-notebook names, paste
      limit, vocabulary, a fixed shopping-list date); ruff clean. ui: 1503 vitest tests, lint and
      typecheck clean. Not done: the browser walk (T041) and the PRD update (T043). Details in
      specs/070-shopping-by-store/notes.md.
    notes: >
      New top priority (backlog reordered 2026-11-05). Three parts: a member marks items of the
      kitchen's active shopping list (S-025) as bought and unmarks them; the list is split into tabs
      by the place an item is bought (default places such as farmers market, grocery store,
      supermarket, butcher; people add their own); the place of each ingredient is chosen on an
      ingredient catalog page reached from a side panel nav item (S-064). S-043 (rename and merge
      catalog names) and S-068 (receipts mark lines bought) build on it.

  - id: S-071
    title: Share a recipe with a person from the recipe page (share icon, searchable alias list, co-members first, copy to their default notebook)
    epic: Recipes
    priority: must
    status: in_progress
    journey: J3
    source: owner request 2026-11-05 (post-MVP; not in prd.md; extends J3 and J1a); specs/071-share-recipe-to-user
    notes: >
      Next to implement (owner, 2026-11-05). A share icon in the recipe page header opens a popup with a
      SearchableSelect of user aliases. People who share a kitchen or notebook with the current user come
      first. The send icon (as in invite by email) copies the recipe into the chosen person's default
      notebook; the popup then shows a success message in place of the list. Depends on the S-048 copy
      step, which is still backlog. Open for the owner: the list is assumed to hold co-members only, not
      every account.
    verification: >
      Built 2026-11-05 on main, not committed. API: co-member SQL (adapters/persistence/co_members.py),
      ShareRecipeService (application/recipe_share.py), GET /recipes/share-candidates and
      POST /recipes/{id}/share. UI: ShareRecipeDialog, share icon in RecipeDetailView, BFF routes.
      Research R-1: join times exist (created_at on kitchen_memberships and notebook_membership), so the
      order is recent shared activity, then alias. R-4 gap: no server dedupe of a repeated request.
      Not yet done: quickstart browser walk (T034); archived-kitchen co-members are included by default
      (owner answer pending, T004). Stays in_progress until T034 passes.

